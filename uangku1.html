<style>
:root{--bg:#faf8f3;--card:#fff;--soft:#ece7dc;--ink:#1b2a41;--mut:#6b7280;--navy:#1b2a41;--on:#fff;--gold:#b8963e;--sage:#7d9b76;--blue:#6f93b8;--terra:#c0674a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--soft:#2a3550;--ink:#eee9df;--mut:#9aa3b5;--navy:#2a3a5c;--gold:#d3b062;--sage:#97b690;--blue:#8aaed2;--terra:#d98366}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--soft:#2a3550;--ink:#eee9df;--mut:#9aa3b5;--navy:#2a3a5c;--gold:#d3b062;--sage:#97b690;--blue:#8aaed2;--terra:#d98366}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif}
main{max-width:720px;margin:auto;padding:16px 16px 110px}
h1{font-size:20px;margin:4px 0 14px}h2{font-size:16px;margin:20px 0 8px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(27,42,65,.07)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{border-left:4px solid var(--c);cursor:pointer}.k svg{stroke:var(--c)}
.k .n{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}
.big{font-size:20px;font-weight:700;margin:6px 0 2px}.sm{font-size:12px;color:var(--mut)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}.row:last-child{border:0}
.pos{color:var(--sage)}.neg{color:var(--terra)}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--navy);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:var(--soft);color:var(--ink)}.btn.d{background:var(--terra)}
.quick{display:flex;gap:8px;overflow-x:auto;padding:12px 0}.quick .btn{white-space:nowrap}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--soft);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 10px}
label{font-size:12px;color:var(--mut)}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--c,var(--gold))}
.warn{background:rgba(192,103,74,.14);color:var(--terra);padding:10px 12px;border-radius:12px;margin-bottom:8px;font-weight:500}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--soft);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}nav button.on{color:var(--gold);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--gold);color:#fff;border:0;z-index:6;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer}.fab svg{width:26px;height:26px}
#m{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
#m.o{display:flex}.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.chart{display:flex;gap:8px;align-items:flex-end;height:110px;margin-top:8px}.chart div{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.chart span{display:inline-block;width:42%;border-radius:4px 4px 0 0;min-height:2px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.chips button{border:0;border-radius:20px;padding:6px 12px;background:var(--soft);color:var(--ink);font:inherit;font-size:12px;white-space:nowrap}.chips .on{background:var(--navy);color:var(--on)}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on);padding:10px 16px;border-radius:12px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}#ts.on{opacity:1}.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:20px}.ov .card{max-width:340px}
:root{--bg:#fbf5ea;--gold:#d9a02b;--sage:#4fa56a;--blue:#4a86c5;--terra:#e0684a;--navy:#1f3a68}
body{background:var(--bg) linear-gradient(180deg,color-mix(in srgb,var(--gold) 22%,var(--bg)),var(--bg) 300px) no-repeat}
h1{background:linear-gradient(90deg,var(--ink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{border-left:4px solid var(--gold);padding-left:8px}
.card{border:1px solid color-mix(in srgb,var(--gold) 20%,transparent);box-shadow:0 4px 14px rgba(31,58,104,.09)}
.hero{background:linear-gradient(135deg,#1f3a68,#4a86c5 65%,#d9a02b);color:#fff;border:0}.hero .sm{color:rgba(255,255,255,.88)}.hero .big{font-size:28px}.hero .pos{color:#c4f5cf}.hero .neg{color:#ffd2c2}
.k{background:color-mix(in srgb,var(--c) 11%,var(--card))}.k .n{font-weight:600;color:var(--ink)}
.k .n svg{width:30px;height:30px;padding:6px;border-radius:10px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.btn{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}
.btn.g{background:color-mix(in srgb,var(--gold) 18%,var(--card));color:var(--ink)}
.btn.d{background:linear-gradient(135deg,var(--terra),#f08a5d);color:#fff}
.quick .btn[onclick*="pf('tab')"]{background:linear-gradient(135deg,var(--gold),#f0c458);color:#fff}
.quick .btn[onclick*="pf('inf')"]{background:linear-gradient(135deg,var(--sage),#7cc895);color:#fff}
.quick .btn[onclick*="pf('bel')"]{background:linear-gradient(135deg,var(--blue),#7db4e8);color:#fff}
.quick .btn[onclick*="pf('kon')"]{background:linear-gradient(135deg,var(--terra),#f08a5d);color:#fff}
.fab{background:linear-gradient(135deg,var(--gold),var(--terra))}

const CPAL=['#8a6fb5','#d4709a','#2fa39a','#c9803a','#6c8ebf','#9aa83a'];
function syncCats(){Object.keys(P).forEach(k=>{if(k[0]=='x')delete P[k]});(db.cats||[]).forEach(c=>{P[c.id]=[c.n,'--'+c.id];POUT[c.id]='cx';document.documentElement.style.setProperty('--'+c.id,c.c)})}

function applyPct(m){db.cfg.pct={tab:m.tab,inf:m.inf,bel:m.bel};(db.cats||[]).forEach(c=>c.pct=m[c.id]||0)}
function normPct(m){const ks=Object.keys(m),t=ks.reduce((s,k)=>s+m[k],0)||1,o={};ks.forEach(k=>o[k]=Math.round(m[k]*100/t));const d=100-ks.reduce((s,k)=>s+o[k],0),big=[...ks].sort((a,b)=>o[b]-o[a])[0];o[big]+=d;return o}
function pctCard(){const p=PCT();return`<div class="card"><b>Pembagian pemasukan utama</b><div class="sm">Atur persentase tiap kategori simpanan. Total harus 100%. Berlaku untuk pemasukan baru, transaksi lama tidak berubah.</div>${Object.keys(p).map(k=>`<label>${esc(P[k][0])} (%)</label><input class="nq" id="pc_${k}" type="number" inputmode="numeric" min="0" max="100" value="${p[k]}" oninput="pctSum()">`).join('')}<div class="sm" id="pcs">Total ${Object.values(p).reduce((s,v)=>s+v,0)}%</div><div class="quick" style="padding:8px 0 0"><button class="btn" onclick="pctSave()">Simpan persentase</button><button class="btn g" onclick="pctReset()">Kembali ke awal</button></div></div>`}

function catS(id){const n=gv('cn').trim();if(!n)return toast('Isi nama kategori.');const all=Object.values(P).map(x=>x[0].toLowerCase()),cs=(db.cats=db.cats||[]);
 if(id){const c=cs.find(x=>x.id==id);if(all.includes(n.toLowerCase())&&c.n.toLowerCase()!=n.toLowerCase())return toast('Nama sudah dipakai.');c.n=n;lg('Edit kategori '+n);save();cl();syncCats();go('sett');return}
 if(all.includes(n.toLowerCase()))return toast('Nama sudah dipakai.');const pc=Math.round(+gv('cp')||0);if(!(pc>=0&&pc<100))return toast('Persentase 0 sampai 99.');
 const nid='x'+Date.now().toString(36),cur=PCT(),o={};Object.keys(cur).forEach(k=>o[k]=Math.round(cur[k]*(100-pc)/100));o[nid]=pc;
 cs.push({id:nid,n,pct:0,c:CPAL[cs.length%CPAL.length]});applyPct(normPct(o));lg('Kategori baru '+n);save();cl();syncCats();go('sett');toast(pc>0?'Kategori ditambahkan. Persentase lain disesuaikan otomatis.':'Kategori ditambahkan dengan 0%. Atur persentase di bawah.')}
